name: Praxis Runtime CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: test -f vendor/manifest.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Chromium for the browser driver tests (version pinned by playwright-core)
        run: |
          npx playwright-core install --with-deps chromium
          echo "PRAXIS_BROWSER_EXECUTABLE=$(node -p "require('playwright-core').chromium.executablePath()")" >> "$GITHUB_ENV"
          # The driver keeps Chromium's sandbox on. Ubuntu 24.04 restricts unprivileged user namespaces by default, which the sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run test

  git_delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run accept:git-delivery
      - run: npm run accept:git-delivery-e2e

  quality_gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run accept:quality-startup
      - run: npm run accept:quality-review
      - run: npm run accept:quality-apply
      - run: npm run accept:quality-state-consistency
      - run: npm run accept:quality-readback

  # R1/R2 regression (tools/scripts/r1r2-regression.mjs) against the production bundle this checkout packs, judged by
  # tools/fixtures/r1r2/expectations.json ("fixed"). The macOS-only sandbox-exec rows report SKIP here.
  r1r2_regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tools/scripts/r1r2-regression.mjs --bundle candidate --label "ci-${GITHUB_SHA::7}" --out dist/r1r2 --expect fixed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1r2-regression
          path: |
            dist/r1r2/results.json
            dist/r1r2/results.md
            dist/r1r2/transcripts/

  pack_mcpb:
    runs-on: ubuntu-latest
    needs: [build_test, git_delivery, quality_gates, r1r2_regression]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack:mcpb
      - run: npm run accept:mcpb-runtime
      - name: Checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          paths = list(pathlib.Path("dist/claude-extensions").rglob("praxis-runtime.mcpb"))
          assert paths, "MCPB missing"
          rows = [{"file": str(p), "sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "bytes": p.stat().st_size} for p in paths]
          pathlib.Path("dist/mcpb-checksums.json").write_text(json.dumps(rows, indent=2) + "\n")
          for r in rows: print(r["sha256"], r["file"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: praxis-runtime-mcpb
          path: |
            dist/claude-extensions/
            dist/mcpb-checksums.json

  version_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check this repository version
        run: node tools/scripts/check-ecosystem-version.mjs
